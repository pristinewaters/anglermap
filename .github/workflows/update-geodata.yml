
name: Update AnglerMap geographic data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * 1"

  push:
    paths:
      - "scripts/build_geodata.py"
      - ".github/workflows/update-geodata.yml"

permissions:
  contents: write

concurrency:
  group: anglermap-geodata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-geodata:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests shapely

      - name: Build geographic data
        run: |
          python scripts/build_geodata.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "data/magallanes/communes.geojson",
              "data/magallanes/waterbodies.geojson",
              "data/magallanes/dga_stations.geojson",
              "data/metadata/sources.json"
          ]

          for filename in required:
              path = Path(filename)

              if not path.exists():
                  raise SystemExit(
                      f"Missing required file: {filename}"
                  )

              if path.stat().st_size == 0:
                  raise SystemExit(
                      f"Empty required file: {filename}"
                  )

          for filename in required[:-1]:
              with open(filename, encoding="utf-8") as file:
                  data = json.load(file)

              if data.get("type") != "FeatureCollection":
                  raise SystemExit(
                      f"Invalid GeoJSON: {filename}"
                  )

              if filename != "data/magallanes/dga_stations.geojson" and not data.get("features"):
                  raise SystemExit(
                      f"No features in: {filename}"
                  )

          with open(
              "data/metadata/sources.json",
              encoding="utf-8"
          ) as file:
              json.load(file)

          print("All generated files passed validation.")
          PY

      - name: Commit generated geographic data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/magallanes data/metadata/sources.json

          if git diff --cached --quiet; then
            echo "No geographic data changes."
          else
            git commit -m "Update AnglerMap geographic data"
            git push
          fi
