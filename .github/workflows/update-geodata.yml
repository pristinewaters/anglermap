
name: Update AnglerMap geographic data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
  push:
    paths:
      - "scripts/build_geodata.py"
      - ".github/workflows/update-geodata.yml"

permissions:
  contents: write

jobs:
  build-geodata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests shapely

      - name: Build Magallanes geographic data
        run: |
          python scripts/build_geodata.py

      - name: Commit generated geographic data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/magallanes data/metadata/sources.json

          if git diff --cached --quiet; then
            echo "No geographic data changes."
          else
            git commit -m "Update AnglerMap geographic data"
            git push
          fi
