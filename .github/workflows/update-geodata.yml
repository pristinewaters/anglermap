
name: Update AnglerMap geographic data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * 1"

  push:
    paths:
      - "scripts/build_geodata.py"
      - ".github/workflows/update-geodata.yml"

permissions:
  contents: write

concurrency:
  group: anglermap-geodata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-geodata:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests shapely

      - name: Validate source syntax
        run: |
          python -m py_compile scripts/build_geodata.py
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          for index, source in enumerate(scripts):
              Path(f"/tmp/anglermap-inline-{index}.js").write_text(source, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline JavaScript blocks.")
          PY
          for file in /tmp/anglermap-inline-*.js; do node --check "$file"; done

      - name: Build geographic data
        run: |
          python scripts/build_geodata.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "data/magallanes/communes.geojson",
              "data/magallanes/provinces.geojson",
              "data/magallanes/waterbodies.geojson",
              "data/magallanes/dga_hydro_units.geojson",
              "data/magallanes/dga_stations.geojson",
              "data/metadata/sources.json"
          ]

          for filename in required:
              path = Path(filename)

              if not path.exists():
                  raise SystemExit(
                      f"Missing required file: {filename}"
                  )

              if path.stat().st_size == 0:
                  raise SystemExit(
                      f"Empty required file: {filename}"
                  )

          for filename in required[:-1]:
              with open(filename, encoding="utf-8") as file:
                  data = json.load(file)

              if data.get("type") != "FeatureCollection":
                  raise SystemExit(
                      f"Invalid GeoJSON: {filename}"
                  )

              if filename in (
                  "data/magallanes/communes.geojson",
                  "data/magallanes/waterbodies.geojson"
              ) and not data.get("features"):
                  raise SystemExit(
                      f"No features in required layer: {filename}"
                  )

          with open(
              "data/metadata/sources.json",
              encoding="utf-8"
          ) as file:
              json.load(file)

          print("All generated files passed validation.")
          PY

      - name: Activate validated layers in catalog
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          catalog_path = Path("data/metadata/layers.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          root = Path("data")
          file_counts = {}

          for layer in catalog["layers"]:
              path = root / layer["file"]
              if not path.exists():
                  layer["status"] = "pending"
                  continue
              try:
                  collection = json.loads(path.read_text(encoding="utf-8"))
                  count = len(collection.get("features", []))
              except Exception:
                  layer["status"] = "pending"
                  continue
              file_counts[layer["id"]] = count
              layer["status"] = "available" if count > 0 else "pending"

          catalog["updated_at"] = datetime.now(timezone.utc).isoformat()
          catalog["feature_counts"] = file_counts
          catalog_path.write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(file_counts, ensure_ascii=False))
          PY

      - name: Commit generated geographic data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/magallanes data/metadata/sources.json data/metadata/layers.json

          if git diff --cached --quiet; then
            echo "No geographic data changes."
          else
            git commit -m "Update AnglerMap geographic data"
            git push
          fi
